<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="renal-score-selection.svg"><rect width="800" height="450" rx="20" fill="#101e32"/><style>text{font-family:Arial,sans-serif;fill:#e8eef8}.h{font-size:24px;font-weight:700}.t{font-size:17px}.sm{font-size:14px;fill:#b6c9e2}.kid{fill:#396b90;stroke:#a3d5f5;stroke-width:4}.tum{fill:#e9a84e;stroke:#ffe3ad;stroke-width:3}.line{stroke:#a7c4df;stroke-width:2;fill:none}</style><text x="30" y="42" class="h">Choose the appropriate renal tool</text><rect x="50" y="80" width="700" height="60" rx="12" fill="#284d75"/><text x="400" y="117" text-anchor="middle" class="t">What is the clinical question?</text><path class="line" d="M400 140 V168 H145 V190"/><rect x="33" y="190" width="224" height="118" rx="12" fill="#213c59" stroke="#6d9ac1"/><text x="145" y="219" text-anchor="middle" class="t">Mass anatomy</text><text x="145" y="251" text-anchor="middle" class="sm">RENAL</text><text x="145" y="274" text-anchor="middle" class="sm">Bosniak v2019</text><path class="line" d="M400 140 V168 H400 V190"/><rect x="288" y="190" width="224" height="118" rx="12" fill="#213c59" stroke="#6d9ac1"/><text x="400" y="219" text-anchor="middle" class="t">After nephrectomy</text><text x="400" y="251" text-anchor="middle" class="sm">Leibovich / VENUSS</text><text x="400" y="274" text-anchor="middle" class="sm">UISS / SSIGN</text><path class="line" d="M400 140 V168 H655 V190"/><rect x="543" y="190" width="224" height="118" rx="12" fill="#213c59" stroke="#6d9ac1"/><text x="655" y="219" text-anchor="middle" class="t">Metastatic RCC</text><text x="655" y="251" text-anchor="middle" class="sm">IMDC / Heng</text><text x="655" y="274" text-anchor="middle" class="sm">Systemic therapy context</text><text x="30" y="380" class="sm">Use scores only in their validated histological, disease-stage and treatment populations.</text><text x="30" y="405" class="sm">Scores do not independently determine treatment, surveillance or operative suitability.</text></svg>